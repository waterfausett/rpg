<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rpg · Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="app">
    <nav id="nav" aria-label="Settings sections">
      <button type="button" data-section="notifications">Notifications</button>
      <button type="button" data-section="sounds">Sounds</button>
      <button type="button" data-section="integrations">Integrations</button>
      <button type="button" data-section="repos">Repos</button>
    </nav>
    <main id="pane">
      <section class="panel" data-section="notifications" hidden></section>
      <section class="panel" data-section="sounds" hidden></section>
      <section class="panel" data-section="integrations" hidden></section>
      <section class="panel" data-section="repos" hidden></section>
      <section class="panel broken" id="broken" hidden>
        <h2>Settings</h2>
        <p class="broken-msg">config.toml has an error, so settings can't be saved until it's fixed</p>
        <pre class="broken-err" id="broken-err"></pre>
        <div class="broken-actions">
          <button type="button" class="btn" id="open-config">Open config file</button>
          <button type="button" class="btn" id="check-again">Check again</button>
        </div>
      </section>
    </main>
  </div>
  <footer class="status" id="status" role="status" aria-live="polite">Loading…</footer>
  <script src="settings.js"></script>
</body>
</html>
