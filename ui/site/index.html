<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rpg: Character Sheet</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header class="bar">
    <div class="crest" id="crest" aria-label="Level">
      <b id="level">1</b>
      <small>Level</small>
    </div>
    <div class="who">
      <div class="cls">Crawler</div>
      <div class="nm">you</div>
      <div class="xpbar" role="progressbar" aria-label="Experience">
        <div class="xpfill" id="xpfill"></div>
      </div>
      <div class="xpline"><span id="xptext">0 / 100 exp to level 2</span><span id="xptotal">0 total</span></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="character" class="active">Character</button>
    <button role="tab" data-tab="achievements">Achievements <span class="pill" id="achcount"></span></button>
    <button role="tab" data-tab="events">Event log</button>
  </nav>

  <main>
    <section id="tab-character" class="panel">
      <h2>Totals</h2>
      <div class="totals" id="totals"></div>
      <h2>Skills</h2>
      <ul class="skills" id="skills"></ul>
      <h2>Recent</h2>
      <ul class="list" id="recent"></ul>
    </section>

    <section id="tab-achievements" class="panel" hidden>
      <div class="grid" id="achievements"></div>
      <p class="hiddenleft" id="hiddenleft" hidden></p>

      <section id="quests" hidden>
        <h2>Quests</h2>
        <div class="totals" id="questtotals"></div>
        <h3>Log</h3>
        <ul class="qlog" id="questlog"></ul>
        <h3>Board</h3>
        <div class="grid" id="questboard"></div>
      </section>
    </section>

    <section id="tab-events" class="panel" hidden>
      <div class="chips" id="kinds" role="group" aria-label="Kind">
        <button class="chip on" data-kind="" aria-pressed="true">all</button>
        <button class="chip" data-kind="commit" aria-pressed="false">commit</button>
        <button class="chip" data-kind="push" aria-pressed="false">push</button>
        <button class="chip" data-kind="pr_opened" aria-pressed="false">pr_opened</button>
        <button class="chip" data-kind="pr_merged" aria-pressed="false">pr_merged</button>
        <button class="chip" data-kind="review_submitted" aria-pressed="false">review</button>
        <button class="chip" data-kind="claude_session_start" aria-pressed="false">session start</button>
        <button class="chip" data-kind="claude_session_end" aria-pressed="false">session end</button>
      </div>
      <ul class="list" id="eventlog"></ul>
    </section>
  </main>

  <script src="/site.js"></script>
</body>
</html>
