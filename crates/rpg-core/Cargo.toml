[package]
name = "rpg-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
ulid = "1"
directories = "5"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
which = "6"

[dev-dependencies]
tempfile = "3"
