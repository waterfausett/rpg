[package]
name = "rpg-app"
version.workspace = true
edition = "2021"

[[bin]]
name = "rpg-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = "0.4"
notify = "8"
fastrand = "2"
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
rpg-core = { path = "../rpg-core" }
tokio = { version = "1", features = ["net", "rt", "macros", "time", "sync"] }
axum = "0.8"
rust-embed = { version = "8", features = ["mime-guess"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[dev-dependencies]
assert_cmd = "2"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
