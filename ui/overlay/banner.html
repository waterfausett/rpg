<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rpg banner</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body data-overlay="banner">
  <div class="ach-pulse" id="pulse"></div>
  <div class="ach-b" id="banner">
    <div class="hdr" id="title"></div>
    <div class="name" id="name"></div>
    <div class="desc" id="text"></div>
    <div class="rew" id="reward"></div>
    <!-- Quest offers only (.quest-b): goal, Accept / Pass, stakes, and the fuse. -->
    <div class="goal" id="goal"></div>
    <div class="acts"><button class="acc" id="accept" type="button">Accept</button><button class="pas" id="pass" type="button">Pass</button></div>
    <div class="stakes" id="stakes"></div>
    <div class="fuse" id="fuse"></div><div class="spark" id="spark"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
