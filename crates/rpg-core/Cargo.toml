[package]
name = "rpg-core"
version.workspace = true
edition = "2021"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
ulid = "1"
directories = "5"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
which = "6"
wait-timeout = "0.2"
clap = { version = "4", features = ["derive"] }
globset = "0.4"

[dev-dependencies]
tempfile = "3"
