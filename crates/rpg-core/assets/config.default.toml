[xp]
commit = 10
push = 25
pr_opened = 50
pr_merged = 100
review = 40
claude_session = 15

[levels]
base = 1000.0
exponent = 1.5

[skill_levels]
base = 100.0
exponent = 1.5

[github]
enabled = true
poll_minutes = 10

[llm]
enabled = true
timeout_secs = 10
model = "haiku"

[sound]
volume = 0.8

# How an unlock is announced when its rule doesn't say: "banner" or "toast" (a small pop-up, no sound).
[announce]
# all = "banner"   # or "toast". Overrides the rule, step and tier settings for every achievement unlock, and first_banner.
# An achievement's first-ever unlock (for a ladder, its first step) is a banner; later unlocks use the settings below.
first_banner = true
bronze = "toast"
silver = "banner"
gold = "banner"
platinum = "banner"
legendary = "banner"
celestial = "banner"

[site]
port = 47474

# Which repos count. A plain folder covers everything under it; globs work too.
# Example: exclude = ['C:\Users\me\AppData\Local\Temp']
[paths]
include = []
exclude = []

# Hours between automatic update checks; 0 = only from the tray's "Check for updates".
[updates]
check_hours = 6

# Timed quests, offered after things you do. false turns them off (an active quest ends quietly).
[quests]
enabled = true
offer_seconds = 60       # how long an offer waits for Accept
max_passes = 3           # passes (or ignored offers) in a row that break the chain
chain_step = 0.5         # multiplier gained per completion: x1, x1.5, x2, ...
chain_max = 5.0          # multiplier cap
min_gap_minutes = 30     # min time between any two offers
